name: refresh hub facts

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild from live GitHub facts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build.py
      - name: Check the links
        continue-on-error: true
        run: python3 build.py --offline --check
      - name: Commit if the numbers moved
        run: |
          if git diff --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html facts.json
          git commit -m "Refresh counts and dates from GitHub"
          git push
